
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Piramide</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Mijn Grid Piramide</h1>

        <!-- Rij 1: 1 blok -->
        <div class="row">
            <div class="col-5 spacer"></div>
            <div class="col-2">
                <div class="piramide-blok">1</div>
            </div>
            <div class="col-5 spacer"></div>
        </div>

        <!-- Rij 2: 2 blokken -->
        <div class="row">
            <div class="col-4 spacer"></div>
            <div class="col-2">
                <div class="piramide-blok">2</div>
            </div>
            <div class="col-2">
                <div class="piramide-blok">3</div>
            </div>
            <div class="col-4 spacer"></div>
        </div>

        <!-- Rij 3: 3 blokken -->
        <div class="row">
            <div class="col-3 spacer"></div>
            <div class="col-2">
                <div class="piramide-blok">4</div>
            </div>
            <div class="col-2">
                <div class="piramide-blok">5</div>
            </div>
            <div class="col-2">
                <div class="piramide-blok">6</div>
            </div>
            <div class="col-3 spacer"></div>
        </div>

        <!-- Rij 4: 4 blokken -->
        <div class="row">
            <div class="col-2 spacer"></div>
            <div class="col-2">
                <div class="piramide-blok">7</div>
            </div>
            <div class="col-2">
                <div class="piramide-blok">8</div>
            </div>
            <div class="col-2">
                <div class="piramide-blok">9</div>
            </div>
            <div class="col-2">
                <div class="piramide-blok">10</div>
            </div>
            <div class="col-2 spacer"></div>
        </div>

    </div>

</body>
</html>
